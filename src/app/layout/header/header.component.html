<header class="header" [class.menu-open]="mobileMenuOpen()">
  <div class="header__container">
    <a routerLink="/" class="header__logo" (click)="closeMobileMenu()" aria-label="Home">
      <span class="header__logo-icon">&#x2302;</span>
      <span class="header__logo-text">Larry ML</span>
    </a>

    <nav class="header__nav" [class.active]="mobileMenuOpen()">
      <a routerLink="/blog" routerLinkActive="active" class="header__link" (click)="closeMobileMenu()">
        {{ 'NAV.BLOG' | translate }}
      </a>
      <a routerLink="/projects" routerLinkActive="active" class="header__link" (click)="closeMobileMenu()">
        {{ 'NAV.PROJECTS' | translate }}
      </a>
      <a routerLink="/about" routerLinkActive="active" class="header__link" (click)="closeMobileMenu()">
        {{ 'NAV.ABOUT' | translate }}
      </a>
    </nav>

    <div class="header__actions">
      <button
        class="header__lang-toggle"
        (click)="languageService.toggle()"
        [attr.aria-label]="'LANG.SWITCH' | translate">
        {{ languageService.currentLang() === 'fr' ? 'EN' : 'FR' }}
      </button>

      <button
        class="header__theme-toggle"
        (click)="themeService.toggle()"
        [attr.aria-label]="'THEME.TOGGLE' | translate">
        @if (themeService.theme() === 'dark') {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        }
      </button>

      <button
        class="header__hamburger"
        (click)="toggleMobileMenu()"
        [attr.aria-label]="mobileMenuOpen() ? 'Close menu' : 'Open menu'"
        [attr.aria-expanded]="mobileMenuOpen()">
        <span class="header__hamburger-line"></span>
        <span class="header__hamburger-line"></span>
        <span class="header__hamburger-line"></span>
      </button>
    </div>
  </div>
</header>
