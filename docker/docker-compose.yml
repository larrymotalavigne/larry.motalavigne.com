services:
  larry-motalavigne:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/larrymotalavigne/larry-motalavigne-com:latest
    container_name: larry-motalavigne
    restart: unless-stopped
    networks:
      - larry-motalavigne

  nginx:
    image: registry.gitlab.ggcorp.fr/internal/docker-cache/nginx:alpine
    container_name: larry-motalavigne-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      larry-motalavigne:
        condition: service_healthy
    networks:
      - larry-motalavigne

networks:
  larry-motalavigne:
    name: larry-motalavigne
    driver: bridge
